name: Static checks

# Text/XML checks only - no Excel/COM involved, so this runs on a normal
# hosted runner. See tools/Test-StaticChecks.ps1 for what's actually checked,
# and CONTRIBUTING.md for the source-vs-built-.xlam drift check, which does
# need COM and stays a local pre-release step instead of living here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR makes the older run pointless; runs on main are
# left to finish so every merged commit keeps its own result.
concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proves each check still fires on a seeded mistake before trusting a
      # clean result from the real tree.
      - name: Self-test the checks
        shell: pwsh
        run: tools/Test-StaticChecks.ps1 -SelfTest

      - name: Run static source checks
        shell: pwsh
        run: tools/Test-StaticChecks.ps1
